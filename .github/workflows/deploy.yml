name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Automated Verification Tests
        run: npm run test:edge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://nxwjkawsnjrebxzdkedl.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_N3sGFMf59Kt2EKcrusYdDw_qfcoRiy5' }}

      - name: 🏗️ Build Production Assets (Vite & TypeScript)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://nxwjkawsnjrebxzdkedl.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_N3sGFMf59Kt2EKcrusYdDw_qfcoRiy5' }}
          VITE_EDGE_API_URL: ${{ secrets.VITE_EDGE_API_URL || '' }}

      - name: 🔍 Check Cloudflare Credentials
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Deploy to Cloudflare Pages
        if: steps.check_cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=medicine-database --branch=main

      - name: ℹ️ Notice if Cloudflare Secrets are Not Set
        if: steps.check_cf.outputs.has_token != 'true'
        run: |
          echo "::notice title=Cloudflare Deployment Skipped::CLOUDFLARE_API_TOKEN secret is not configured in GitHub repository settings. Build & Verification passed successfully. To auto-deploy via GitHub Actions, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Settings -> Secrets and variables -> Actions."

